<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4e7"/>
    </linearGradient>
    <!-- Faint light along the top inner edge of the tile -->
    <filter id="tile-inner" x="0" y="0" width="100%" height="100%">
      <feOffset in="SourceAlpha" dy="10" result="offset"/>
      <feGaussianBlur in="offset" stdDeviation="8" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.14"/>
      <feComposite in2="edge" operator="in" result="highlight"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="highlight"/>
      </feMerge>
    </filter>
    <!-- Soft shade inside the lower edges of the bolt -->
    <filter id="bolt-inner" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset in="SourceAlpha" dy="-18" result="offset"/>
      <feGaussianBlur in="offset" stdDeviation="14" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#000000" flood-opacity="0.28"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shade"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Solid fill: a dark gradient bands visibly at 8-bit color depth -->
  <rect width="1024" height="1024" rx="228" fill="#18181b" filter="url(#tile-inner)"/>
  <path d="M600 112 L268 592 L488 592 L424 912 L756 432 L536 432 L664 112 Z"
        fill="url(#bolt)" stroke="url(#bolt)" stroke-width="28" stroke-linejoin="round" filter="url(#bolt-inner)"/>
</svg>
